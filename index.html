<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Control simple y acumulativo de ingresos y egresos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>SALDO</title>
<style>
:root{color-scheme:dark;--bg:#0A0A0A;--card:#141414;--text:#F5F5F5;--muted:#9CA3AF;--line:#292929;--accent:#22C55E;--green:#22C55E;--red:#EF4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:auto;padding:24px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:27px;font-weight:850;letter-spacing:-1.5px}.brand span{color:#3b82f6}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px 11px;border-radius:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px;margin-bottom:15px}
.muted{color:var(--muted)}.balance{font-size:clamp(36px,10vw,50px);font-weight:800;letter-spacing:-2px;margin:5px 0 18px;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);padding-top:15px}
.metric{font-size:23px;font-weight:750;overflow-wrap:anywhere}.green{color:var(--green)}.red{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
button{font:inherit;cursor:pointer;border:0}
.action{padding:15px 10px;border-radius:14px;font-weight:700;background:#22C55E;color:#0A0A0A}
.action.out{background:var(--card);color:var(--text);border:1px solid var(--line)}
h2{font-size:18px;margin:0 0 10px}
form{display:none}.field{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;margin:7px 0 14px}
.save{width:100%;padding:14px;border-radius:12px;background:#22C55E;color:#0A0A0A;font-weight:700}
.entry{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border:0}.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg);font-size:19px}
.desc{flex:1;min-width:0}.desc strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.desc small{color:var(--muted)}
.amount{font-weight:750;font-size:14px;white-space:nowrap}.delete{display:block;margin:4px 0 0 auto;background:none;color:var(--muted);font-size:11px;text-decoration:underline}
.empty{text-align:center;padding:25px 5px;color:var(--muted);font-size:14px}
.footer{display:flex;justify-content:space-between;gap:10px;margin:15px 2px;font-size:12px;color:var(--muted)}
.link{background:none;color:var(--muted);text-decoration:underline;padding:0}
#notice{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}
</style>
</head>
<body>
<main>
<header><div><div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1.5px">TU DINERO, SIN COMPLICACIONES</div><div class="brand">SALDO<span>.</span></div></div><div class="pill">∞ Acumulativo</div></header>
<section class="card">
<div class="muted">Dinero disponible</div><div class="balance" id="balance">$0.00</div>
<div class="metrics"><div><div class="muted" style="font-size:13px">↗ Ingresos</div><div class="metric green" id="income">$0.00</div></div><div><div class="muted" style="font-size:13px">↘ Egresos</div><div class="metric red" id="expense">$0.00</div></div></div>
</section>
<div class="actions"><button class="action" id="incomeBtn">＋ Ingreso</button><button class="action out" id="expenseBtn">－ Egreso</button></div>
<section class="card" id="formCard" hidden>
<h2 id="formTitle">Nuevo movimiento</h2>
<form id="movementForm" style="display:block">
<input type="hidden" id="type">
<label>Cantidad ($)<input class="field" id="amountInput" type="number" min=".01" step=".01" placeholder="0.00" required></label>
<label>Concepto (opcional)<input class="field" id="description" maxlength="70" placeholder="Ej. salario, comida, transporte"></label>
<label>Fecha<input class="field" id="dateInput" type="date" required></label>
<button class="save" type="submit">Guardar movimiento</button>
<button type="button" class="link" id="cancel" style="margin-top:12px">Cancelar</button>
</form>
</section>
<section class="card"><h2>Movimientos <span class="muted" style="font-size:12px;font-weight:400" id="count">0 registros</span></h2><div id="entries"></div><div class="empty" id="empty">📒<br><strong style="color:var(--text)">Todavía no hay movimientos</strong><br>Registra tu primer ingreso o egreso.</div></section>
<div class="footer"><button class="link" id="export">Exportar CSV</button><button class="link" id="clear">Borrar historial</button></div>
<div id="notice">Tus datos se guardan en este dispositivo.</div>
</main>
<script>
const KEY='saldo_movements_v1';let rows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(rows))rows=[]}catch(e){rows=[]}
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(n);
const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows));$('notice').textContent='Cambios guardados en este dispositivo.'}catch(e){$('notice').textContent='No se pudo guardar. Exporta una copia.'}}
function render(){
 let inc=rows.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),out=rows.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 $('balance').textContent=money(inc-out);$('income').textContent=money(inc);$('expense').textContent=money(out);$('count').textContent=rows.length+' registros';
 $('entries').replaceChildren();$('empty').hidden=rows.length>0;
 [...rows].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(x=>{
  let el=document.createElement('div');el.className='entry';let dot=document.createElement('div');dot.className='dot';dot.textContent=x.type==='income'?'↗':'↘';
  let desc=document.createElement('div');desc.className='desc';let strong=document.createElement('strong');strong.textContent=x.description||(x.type==='income'?'Ingreso':'Egreso');let small=document.createElement('small');small.textContent=x.date;desc.append(strong,small);
  let right=document.createElement('div');let amt=document.createElement('div');amt.className='amount '+(x.type==='income'?'green':'red');amt.textContent=(x.type==='income'?'+':'−')+money(x.amount);let del=document.createElement('button');del.className='delete';del.textContent='Eliminar';del.onclick=()=>{if(confirm('¿Eliminar este movimiento?')){rows=rows.filter(y=>y.id!==x.id);save();render()}};right.append(amt,del);el.append(dot,desc,right);$('entries').append(el)
 })
}
function open(type){$('type').value=type;$('formTitle').textContent=type==='income'?'Añadir ingreso':'Añadir egreso';$('dateInput').value=today();$('amountInput').value='';$('description').value='';$('formCard').hidden=false;$('amountInput').focus()}
$('incomeBtn').onclick=()=>open('income');$('expenseBtn').onclick=()=>open('expense');$('cancel').onclick=()=>$('formCard').hidden=true;
$('movementForm').onsubmit=e=>{e.preventDefault();let amount=Number($('amountInput').value);if(!Number.isFinite(amount)||amount<=0)return;rows.push({id:Date.now()+Math.random(),type:$('type').value,amount:Math.round(amount*100)/100,description:$('description').value.trim(),date:$('dateInput').value});save();render();$('formCard').hidden=true};
$('clear').onclick=()=>{if(rows.length&&confirm('¿Borrar todos los movimientos? No se puede deshacer.')){rows=[];save();render()}};
$('export').onclick=()=>{let data=[['Fecha','Tipo','Concepto','Cantidad'],...rows.map(x=>[x.date,x.type==='income'?'Ingreso':'Egreso',x.description,x.amount])];let csv=data.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='saldo-movimientos.csv';a.click();URL.revokeObjectURL(u)};
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
