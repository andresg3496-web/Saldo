<!doctype html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Control simple y acumulativo de ingresos y egresos.">
<link rel="icon" href="icon-192.png">
<title>SALDO</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--card:#fff;--text:#171923;--muted:#737987;--line:#e7e9ee;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:24px 18px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:15px}
.balance{font-size:50px;font-weight:800;margin:5px 0 18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.action{padding:15px;border-radius:14px;font-weight:700;background:#22c55e;color:white;border:0}
.action.out{background:var(--card);color:var(--text);border:1px solid var(--line)}
.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}
.save{width:100%;padding:13px;border-radius:12px;background:#22c55e;color:white;font-weight:700;border:0}
</style>
</head>
<body>
<main>
<section class="card"><div>Dinero disponible</div><div class="balance" id="balance">$0.00</div>
<div style="display:flex;gap:20px"><div>Ingresos <div id="income">$0.00</div></div><div>Egresos <div id="expense">$0.00</div></div></div></section>
<div class="actions"><button class="action" id="incomeBtn">+ Ingreso</button><button class="action out" id="expenseBtn">- Egreso</button></div>
<section class="card" id="formCard" hidden><h2 id="formTitle">Nuevo movimiento</h2>
<form id="movementForm"><input type="hidden" id="type">
<input class="field" id="amountInput" type="number" min="0.01" step="0.01" placeholder="0.00" required><br><br>
<input class="field" id="description" placeholder="Concepto"><br><br>
<input class="field" id="dateInput" type="date" required><br><br>
<button class="save" type="submit">Guardar</button>
<button type="button" id="cancel">Cancelar</button></form></section>
<section class="card"><h2>Movimientos <span id="count">0 registros</span></h2><div id="entries"></div></section>
</main>
<script>
const KEY='saldo_movements_v1';let rows=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id),money=new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format;
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(rows))}
function render(){let inc=rows.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),out=rows.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
$('balance').textContent=money(inc-out);$('income').textContent=money(inc);$('expense').textContent=money(out);$('count').textContent=rows.length+' registros';
$('entries').innerHTML=rows.map(x=>`<div>${x.date} - ${x.type} - ${money(x.amount)} - ${x.description}</div>`).join('')}
function open(t){$('type').value=t;$('formTitle').textContent=t==='income'?'Añadir ingreso':'Añadir egreso';$('formCard').hidden=false;$('dateInput').value=today()}
$('incomeBtn').onclick=()=>open('income');$('expenseBtn').onclick=()=>open('expense');$('cancel').onclick=()=>$('formCard').hidden=true;
$('movementForm').onsubmit=(e)=>{e.preventDefault();rows.push({id:Date.now(),type:$('type').value,amount:Number($('amountInput').value),description:$('description').value,date:$('dateInput').value||today()});save();$('formCard').hidden=true;render()}
render();if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js')});
</script>
</body></html>
